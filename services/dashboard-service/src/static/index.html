<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд ДГИ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .icon { font-size: 64px; margin-bottom: 10px; }
        h1 { color: #333; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 14px; }
        .status {
            display: inline-block;
            padding: 4px 12px;
            background: #10b981;
            color: white;
            border-radius: 12px;
            font-size: 12px;
            margin-top: 10px;
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .metric-card {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }
        .metric-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .metric-label {
            font-size: 14px;
            opacity: 0.9;
        }
        .info {
            background: #f3f4f6;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
        }
        .info h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .info p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #6366f1;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 10px;
        }
        .btn:hover { background: #4f46e5; }
        .logout-btn { background: #ef4444; }
        .logout-btn:hover { background: #dc2626; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">📊</div>
            <h1>Дашборд ДГИ</h1>
            <p class="subtitle">Аналитическая панель с показателями и статистикой</p>
            <span class="status" id="status">Проверка авторизации...</span>
        </div>

        <div class="metrics" id="metrics">
            <!-- Metrics will be loaded here -->
            <div class="metric-card">
                <div class="metric-value">—</div>
                <div class="metric-label">Загрузка...</div>
            </div>
        </div>

        <div class="info">
            <h3>📈 Доступные отчеты:</h3>
            <p>• Просмотры видео (график)<br>
               • Активность пользователей (таблица)<br>
               • Использование хранилища (график)<br>
               • Экспорт данных в PDF/Excel</p>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <a href="http://localhost:3002" class="btn">← Вернуться на портал</a>
            <button onclick="logout()" class="btn logout-btn">Выйти</button>
        </div>
    </div>

    <script>
        const TOKEN_KEY = 'access_token';
        const REFRESH_KEY = 'refresh_token';
        
        async function checkAuth() {
            const token = localStorage.getItem(TOKEN_KEY);
            const refresh = localStorage.getItem(REFRESH_KEY);
            const statusEl = document.getElementById('status');
            
            // Extract tokens from URL if missing
            if (!token || !refresh) {
                const urlParams = new URLSearchParams(window.location.search);
                const accessToken = urlParams.get('access_token');
                const refreshToken = urlParams.get('refresh_token');
                
                if (accessToken && refreshToken) {
                    localStorage.setItem(TOKEN_KEY, accessToken);
                    localStorage.setItem(REFRESH_KEY, refreshToken);
                    window.history.replaceState({}, '', window.location.pathname);
                }
            }
            
            const currentToken = localStorage.getItem(TOKEN_KEY);
            if (!currentToken) {
                statusEl.textContent = 'Не авторизован';
                statusEl.style.background = '#ef4444';
                return;
            }
            
            try {
                const res = await fetch('http://localhost:3003/api/metrics', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    statusEl.textContent = 'Авторизован';
                    statusEl.style.background = '#10b981';
                    renderMetrics(data.metrics);
                } else {
                    throw new Error('Invalid token');
                }
            } catch (err) {
                statusEl.textContent = 'Ошибка авторизации';
                statusEl.style.background = '#ef4444';
            }
        }
        
        function renderMetrics(metrics) {
            const container = document.getElementById('metrics');
            container.innerHTML = '';
            
            const labels = {
                'total_users': 'Всего пользователей',
                'active_users': 'Активных',
                'videos_uploaded': 'Видео загружено',
                'total_views': 'Просмотров',
                'storage_used_gb': 'Хранилище (ГБ)',
                'peak_viewers': 'Пиковых зрителей'
            };
            
            for (const [key, value] of Object.entries(metrics)) {
                const card = document.createElement('div');
                card.className = 'metric-card';
                card.innerHTML = `
                    <div class="metric-value">${value.toLocaleString()}</div>
                    <div class="metric-label">${labels[key] || key}</div>
                `;
                container.appendChild(card);
            }
        }
        
        function logout() {
            localStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(REFRESH_KEY);
            window.location.href = 'http://localhost:3002';
        }
        
        checkAuth();
    </script>
</body>
</html>
