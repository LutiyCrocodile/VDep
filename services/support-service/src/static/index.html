<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Техподдержка ДГИ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .icon { font-size: 64px; margin-bottom: 10px; }
        h1 { color: #333; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 14px; }
        .status {
            display: inline-block;
            padding: 4px 12px;
            background: #10b981;
            color: white;
            border-radius: 12px;
            font-size: 12px;
            margin-top: 10px;
        }
        .ticket-form {
            background: #f3f4f6;
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
        }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #6366f1;
        }
        textarea { resize: vertical; min-height: 100px; }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .submit-btn:hover { transform: translateY(-2px); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .info {
            background: #fef3c7;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
            font-size: 14px;
            color: #92400e;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #6366f1;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 10px;
        }
        .logout-btn { background: #ef4444; }
        .logout-btn:hover { background: #dc2626; }
        .tickets-list { margin-top: 30px; }
        .ticket {
            background: #f9fafb;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #6366f1;
        }
        .ticket-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-open { background: #dbeafe; color: #1e40af; }
        .status-closed { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">🎧</div>
            <h1>Техподдержка ДГИ</h1>
            <p class="subtitle">Система подачи заявок в техническую поддержку</p>
            <span class="status" id="status">Проверка авторизации...</span>
        </div>

        <div class="ticket-form">
            <h3>📝 Создать новую заявку</h3>
            <form id="ticketForm">
                <div class="form-group">
                    <label for="subject">Тема</label>
                    <input type="text" id="subject" required placeholder="Кратко опишите проблему">
                </div>
                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description" required placeholder="Подробно опишите вашу проблему или вопрос"></textarea>
                </div>
                <div class="form-group">
                    <label for="priority">Приоритет</label>
                    <select id="priority">
                        <option value="low">Низкий</option>
                        <option value="medium" selected>Средний</option>
                        <option value="high">Высокий</option>
                        <option value="critical">Критический</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">Создать заявку</button>
            </form>
        </div>

        <div class="tickets-list" id="ticketsList">
            <!-- Tickets will be loaded here -->
        </div>

        <div class="info">
            <strong>💡 Примечание:</strong> Наши специалисты связи с вами в течение 15 минут в рабочее время. Для срочных вопросов используйте телефонный hotline.
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <a href="http://localhost:3002" class="btn">← Вернуться на портал</a>
            <button onclick="logout()" class="btn logout-btn">Выйти</button>
        </div>
    </div>

    <script>
        const TOKEN_KEY = 'access_token';
        const REFRESH_KEY = 'refresh_token';
        
        async function checkAuth() {
            const token = localStorage.getItem(TOKEN_KEY);
            const refresh = localStorage.getItem(REFRESH_KEY);
            const statusEl = document.getElementById('status');
            
            // Extract tokens from URL if missing
            if (!token || !refresh) {
                const urlParams = new URLSearchParams(window.location.search);
                const accessToken = urlParams.get('access_token');
                const refreshToken = urlParams.get('refresh_token');
                
                if (accessToken && refreshToken) {
                    localStorage.setItem(TOKEN_KEY, accessToken);
                    localStorage.setItem(REFRESH_KEY, refreshToken);
                    window.history.replaceState({}, '', window.location.pathname);
                }
            }
            
            const currentToken = localStorage.getItem(TOKEN_KEY);
            if (!currentToken) {
                statusEl.textContent = 'Не авторизован';
                statusEl.style.background = '#ef4444';
                return;
            }
            
            try {
                const res = await fetch('http://localhost:3004/api/tickets', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    statusEl.textContent = 'Авторизован';
                    statusEl.style.background = '#10b981';
                    renderTickets(data.tickets);
                } else {
                    throw new Error('Invalid token');
                }
            } catch (err) {
                statusEl.textContent = 'Ошибка авторизации';
                statusEl.style.background = '#ef4444';
            }
        }
        
        async function createTicket(e) {
            e.preventDefault();
            
            const token = localStorage.getItem(TOKEN_KEY);
            const btn = document.getElementById('submitBtn');
            const subject = document.getElementById('subject').value;
            const description = document.getElementById('description').value;
            const priority = document.getElementById('priority').value;
            
            btn.disabled = true;
            btn.textContent = 'Создание...';
            
            try {
                const res = await fetch('http://localhost:3004/api/tickets', {
                    method: 'POST',
                    headers: {
                        Authorization: `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ subject, description, priority })
                });
                
                if (res.ok) {
                    alert('Заявка создана успешно!');
                    document.getElementById('ticketForm').reset();
                    checkAuth(); // Refresh tickets list
                } else {
                    throw new Error('Failed to create ticket');
                }
            } catch (err) {
                alert('Ошибка при создании заявки');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Создать заявку';
            }
        }
        
        function renderTickets(tickets) {
            const container = document.getElementById('ticketsList');
            container.innerHTML = '<h3>📋 Мои заявки</h3>';
            
            if (tickets.length === 0) {
                container.innerHTML += '<p style="color: #666; margin-top: 10px;">Нет активных заявок</p>';
                return;
            }
            
            tickets.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            
            tickets.forEach(ticket => {
                const date = new Date(ticket.created_at).toLocaleDateString('ru-RU');
                const statusClass = ticket.status === 'open' ? 'status-open' : 'status-closed';
                
                const ticketEl = document.createElement('div');
                ticketEl.className = 'ticket';
                ticketEl.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px;">
                        <strong>${ticket.subject}</strong>
                        <span class="ticket-status ${statusClass}">${ticket.status === 'open' ? 'Открыта' : 'Закрыта'}</span>
                    </div>
                    <p style="color: #666; font-size: 14px; margin-bottom: 5px;">${ticket.description}</p>
                    <p style="color: #999; font-size: 12px;">Создана: ${date} | Приоритет: ${ticket.priority}</p>
                `;
                container.appendChild(ticketEl);
            });
        }
        
        function logout() {
            localStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(REFRESH_KEY);
            window.location.href = 'http://localhost:3002';
        }
        
        document.getElementById('ticketForm').addEventListener('submit', createTicket);
        checkAuth();
    </script>
</body>
</html>
