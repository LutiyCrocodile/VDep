services:
  - type: web
    name: dgi-helpdesk
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dgi-db
          property: externalConnectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: dgi-db
    plan: free
