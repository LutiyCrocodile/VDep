{% extends 'base.html' %}
{% block content %}
  <div class="mx-auto max-w-md card-glow card-panel p-6">
    <h1 class="text-2xl font-semibold">Вход</h1>
    {% if error %}
      <div class="mt-3 rounded-xl bg-red-500/10 p-3 text-sm text-red-200 ring-1 ring-red-500/30">{{ error }}</div>
    {% endif %}
    <form class="mt-4 grid gap-3" method="post" action="/login">
      <div>
        <label class="text-sm text-muted">Логин</label>
        <input name="username" class="mt-1 input-field" />
      </div>
      <div>
        <label class="text-sm text-muted">Пароль</label>
        <input type="password" name="password" class="mt-1 input-field" />
      </div>
      <button class="btn btn-primary mt-2">Войти</button>
    </form>
  </div>
{% endblock %}
