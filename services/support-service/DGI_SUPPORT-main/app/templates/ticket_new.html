{% extends 'base.html' %}
{% block content %}
  <div class="mx-auto max-w-2xl card-glow rounded-2xl bg-slate-900/60 p-6 ring-1 ring-slate-800">
    <h1 class="text-2xl font-semibold">Новая заявка</h1>
    {% if error %}
      <div class="mt-3 rounded-xl bg-red-500/10 p-3 text-sm text-red-200 ring-1 ring-red-500/30">{{ error }}</div>
    {% endif %}
    <form class="mt-4 grid gap-3" method="post" action="/tickets/new">
      <div>
        <label class="text-sm text-slate-300">Тема</label>
        <input name="title" required value="{{ title or '' }}" class="mt-1 w-full rounded-xl bg-slate-950/60 px-3 py-2 ring-1 ring-slate-800 focus:outline-none focus:ring-sky-500" />
      </div>
      <div>
        <label class="text-sm text-slate-300">Описание</label>
        <textarea name="description" required rows="6" class="mt-1 w-full rounded-xl bg-slate-950/60 px-3 py-2 ring-1 ring-slate-800 focus:outline-none focus:ring-sky-500">{{ description or '' }}</textarea>
      </div>
      <div>
        <label class="text-sm text-slate-300">Приоритет</label>
        <select name="priority" class="mt-1 w-full rounded-xl bg-slate-950/60 px-3 py-2 ring-1 ring-slate-800">
          {% set prios = allowed_priorities if allowed_priorities is defined else TicketPriority %}
          {% for p in prios %}
            <option value="{{ p.value }}" {% if (priority or 'normal') == p.value %}selected{% endif %}>{{ TICKET_PRIORITY_LABELS.get(p, p.value) }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="flex gap-3">
        <button class="btn btn-primary">Создать</button>
        <a href="/app" class="btn btn-secondary">Отмена</a>
      </div>
    </form>
  </div>
{% endblock %}
