version: '3.8'

services:
  # PostgreSQL
  db:
    image: postgres:15
    container_name: video_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: video_hosting
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/seed_data.sql
    networks:
      - video_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d video_hosting"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: video_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - video_network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:4.1.8-management
    container_name: video_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - video_network

  # MinIO
  minio:
    image: minio/minio:latest
    container_name: video_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - video_network

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: video_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - video_network

  # Auth Service
  auth-service:
    build: ./services/auth-service
    container_name: auth_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/video_hosting
      SECRET_KEY: ${SECRET_KEY}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      REDIS_URL: redis://redis:6379/0
      LDAP_SERVER: ${LDAP_SERVER}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_BIND_USER: ${LDAP_BIND_USER}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - video_network

  # Video Service
  video-service:
    build: ./services/video-service
    container_name: video_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/video_hosting
      SECRET_KEY: ${SECRET_KEY}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: videos
      AUTH_SERVICE_URL: http://auth-service:8000
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - video_network

  # Celery Worker (Video Transcoding)
  celery-worker:
    build: ./services/video-service
    container_name: celery_worker
    restart: unless-stopped
    command: celery -A src.tasks worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/video_hosting
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: videos
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - video_network

  # Streaming Service
  streaming-service:
    build: ./services/streaming-service
    container_name: streaming_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/video_hosting
      SECRET_KEY: ${SECRET_KEY}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      AUTH_SERVICE_URL: http://auth-service:8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - video_network

  # Notification Service
  notification-service:
    build: ./services/notification-service
    container_name: notification_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/video_hosting
      SECRET_KEY: ${SECRET_KEY}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      AUTH_SERVICE_URL: http://auth-service:8000
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - video_network

  # Search Service
  search-service:
    build: ./services/search-service
    container_name: search_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/video_hosting
      SECRET_KEY: ${SECRET_KEY}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      AUTH_SERVICE_URL: http://auth-service:8000
      VIDEO_SERVICE_URL: http://video-service:8001
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    networks:
      - video_network

  # Messenger Service
  messenger-service:
    build: ./services/messenger-service
    container_name: messenger_service
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
    depends_on:
      - auth-service
    networks:
      - video_network

  # Dashboard Service
  dashboard-service:
    build: ./services/dashboard-service
    container_name: dashboard_service
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
    depends_on:
      - auth-service
    networks:
      - video_network

  # Support Service
  support-service:
    build: ./services/support-service
    container_name: support_service
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
    depends_on:
      - auth-service
    networks:
      - video_network

  # Portal Frontend
  portal:
    build: ./portal
    container_name: portal_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_AUTH_URL: https://api.dgi.mos.ru
      NEXT_PUBLIC_VIDEO_URL: https://video.dgi.mos.ru
    networks:
      - video_network

  # Video Frontend
  frontend:
    build: ./frontend
    container_name: video_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_AUTH_URL: https://api.dgi.mos.ru
      NEXT_PUBLIC_API_URL: https://api.dgi.mos.ru
    networks:
      - video_network

  # Nginx
  nginx:
    image: nginx:latest
    container_name: video_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "1935:1935"
    volumes:
      - ./infrastructure/docker/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - portal
      - frontend
      - auth-service
      - video-service
    networks:
      - video_network

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./infrastructure/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - video_network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - video_network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:

networks:
  video_network:
    driver: bridge
