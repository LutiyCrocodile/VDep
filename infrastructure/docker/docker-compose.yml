
services:
  # Database
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: video_hosting
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d video_hosting"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - video_network

  # Redis for caching and Celery
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - video_network

  # Message queue
  rabbitmq:
    image: rabbitmq:4.1.8-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - video_network

  # Object storage
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - video_network

  # MinIO init - set bucket policy to public
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        sleep 5 &&
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb -p local/videos &&
        mc anonymous set download local/videos &&
        echo 'MinIO bucket configured as public'
      "
    networks:
      - video_network
    restart: 'no'

  # Search engine
  elasticsearch:
    image: elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - video_network

  # Notification service
  notification-service:
    build:
      context: ../../services/notification-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/video_hosting
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SMTP_SERVER: ${SMTP_SERVER:-smtp.dgi.mos.ru}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-notifications@video.dgi.mos.ru}
      AUTH_SERVICE_URL: http://auth-service:8000
    ports:
      - "8003:8003"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - video_network
    restart: unless-stopped

  # Search service
  search-service:
    build:
      context: ../../services/search-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/video_hosting
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: videos
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AUTH_SERVICE_URL: http://auth-service:8000
      VIDEO_SERVICE_URL: http://video-service:8001
      INTERNAL_AUTH_TOKEN: internal-secret-token
    ports:
      - "8004:8004"
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - video_network
    restart: unless-stopped

  # Authentication service
  auth-service:
    build:
      context: ../../services/auth-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/video_hosting
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-internal-secret-token}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Пусто = только локальные пароли из БД (см. database/seed_data.sql). Для LDAP задайте реальный URL в .env.
      LDAP_SERVER: ${LDAP_SERVER:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-DC=dgi,DC=mos,DC=ru}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - video_network
    restart: unless-stopped

  # Video processing service
  video-service:
    build:
      context: ../../services/video-service
      dockerfile: Dockerfile
    volumes:
      - ../../services/video-service/src:/app/src:ro
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/video_hosting
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: videos
      MINIO_SECURE: "false"
      # Хост:порт или полный URL MinIO для ссылок в JSON (браузер), не minio:9000
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-localhost:9000}
      AUTH_SERVICE_URL: http://auth-service:8000
      INTERNAL_AUTH_TOKEN: internal-secret-token
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - video_network
    restart: unless-stopped

  # Celery worker for video processing with GPU support
  celery-worker:
    build:
      context: ../../services/video-service
      dockerfile: Dockerfile.celery
    command: celery -A src.celery_app worker --loglevel=info --queues=video_transcoding,video_processing --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/video_hosting
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: videos
      MINIO_SECURE: "false"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - /tmp  # For temporary files during transcoding
    networks:
      - video_network
    restart: unless-stopped

  # MediaMTX: RTMP ingest + HLS + recordings (shared with streaming-service)
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "1935:1935"
      - "8888:8888"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - recordings_data:/recordings
    networks:
      - video_network
    restart: unless-stopped

  # Streaming service
  streaming-service:
    build:
      context: ../../services/streaming-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/video_hosting
      AUTH_SERVICE_URL: http://auth-service:8000
      INTERNAL_AUTH_TOKEN: internal-secret-token
      NOTIFICATION_SERVICE_URL: http://notification-service:8003
      VIDEO_SERVICE_URL: http://video-service:8001
      REDIS_URL: redis://redis:6379/0
      PUBLIC_HLS_BASE: ${PUBLIC_HLS_BASE:-http://localhost:8888}
      PUBLIC_RTMP_HOST: ${PUBLIC_RTMP_HOST:-localhost}
      PUBLIC_RTMP_PORT: "1935"
      RECORDINGS_PATH: /recordings
    ports:
      - "8002:8002"
    volumes:
      - recordings_data:/recordings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      mediamtx:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - video_network
    restart: unless-stopped

  # Video hosting frontend
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_VIDEO_API_URL=http://localhost:8001
      - NEXT_PUBLIC_STREAMING_API_URL=http://localhost:8002
      - NEXT_PUBLIC_HLS_PUBLIC_BASE=http://localhost:8888
      - NEXT_PUBLIC_RTMP_HOST=localhost
      - NEXT_PUBLIC_RTMP_PORT=1935
      - NEXT_PUBLIC_RTMP_APP=live
    command: npm run dev
    depends_on:
      - auth-service
      - video-service
      - streaming-service
      - mediamtx
    networks:
      - video_network
    restart: unless-stopped

  # Portal frontend (unified entry point)
  portal:
    build:
      context: ../../portal
      dockerfile: Dockerfile
    ports:
      - "3002:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_VIDEO_URL=http://localhost:3000
      - NEXT_PUBLIC_AUTH_URL=http://localhost:8000
    depends_on:
      - auth-service
    networks:
      - video_network
    restart: unless-stopped

  # Reverse proxy and load balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"  # For SSL when configured
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # For SSL certificates
      - nginx_cache:/var/cache/nginx
      - minio_cache:/tmp/minio_cache
    depends_on:
      auth-service:
        condition: service_healthy
      video-service:
        condition: service_healthy
      streaming-service:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - video_network
    restart: unless-stopped

  # Monitoring stack
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - video_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - video_network
    restart: unless-stopped

  # Node exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - video_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  portal_node_modules:
  portal_next:
  frontend_node_modules:
  frontend_next:
  minio_data:
  elasticsearch_data:
  nginx_cache:
  minio_cache:
  prometheus_data:
  grafana_data:
  recordings_data:

networks:
  video_network:
    driver: bridge
