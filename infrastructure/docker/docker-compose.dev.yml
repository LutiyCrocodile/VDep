# Development Docker Compose with hot reload
version: '3.8'

services:
  # Portal frontend for development
  portal-dev:
    build:
      context: ../../portal
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - ../../portal:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_VIDEO_URL=http://localhost:3000
      - NEXT_PUBLIC_AUTH_URL=http://localhost:8000
    command: npm run dev
    networks:
      - video_network

  # Auth service (already in main compose)
  # Video service (already in main compose)

networks:
  video_network:
    external: true
